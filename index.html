async function loadCloudState(){

  const {data,error}=await sb.from("user_app_data").select("data").eq("user_id",authUser.id).maybeSingle();

  localStorage.setItem("ls_saved",JSON.stringify(saved));
  localStorage.setItem("ls_played",JSON.stringify(Array.isArray(d.played)?d.played:[]));
  localStorage.setItem("ls_pots",JSON.stringify(Array.isArray(d.pots)?d.pots:[]));

}

}
async function persistCloudState(){
  if(!sb||!authUser)return;
  const payload={saved,played:getPlayed(),pots:getPots(),updated_at:new Date().toISOString()};
  const {error}=await sb.from("user_app_data").upsert({user_id:authUser.id,data:payload},{onConflict:"user_id"});

async function signOutAccount(){
  if(sb)await sb.auth.signOut();
  authUser=null;saved=[];
  localStorage.setItem("ls_saved","[]");localStorage.setItem("ls_played","[]");localStorage.setItem("ls_pots","[]");

async function initAccount(){
  if(!sb)return;
  const {data}=await sb.auth.getSession();
  authUser=data?.session?.user||null;
  if(authUser)await loadCloudState();

  // Le traitement différé évite de bloquer le verrou interne de session.

      setTimeout(async()=>{
        await loadCloudState();

      },0);

      localStorage.setItem("ls_saved","[]");
      localStorage.setItem("ls_played","[]");

      localStorage.removeItem("lvc_cloud_user");
    }
  });
}

function registerSavedAsPlayed(i){

 const list=getPlayed();
 const duplicate=list.some(y=>y.game===x.game&&y.date===date&&JSON.stringify([...y.nums].sort((a,b)=>a-b) )===JSON.stringify([...x.nums].sort((a,b)=>a-b))&&JSON.stringify([...y.bonus].sort((a,b)=>a-b))===JSON.stringify([...x.bonus].sort((a,b)=>a-b)));
 if(duplicate){alert('Cette grille est déjà enregistrée comme jouée pour ce tirage.');return}
 list.push({id:String(Date.now())+Math.random().toString(16).slice(2),game:x.game,date,nums:[...x.nums].sort((a,b)=>a-b),bonus:[...x.bonus].sort((a,b)=>a-b),createdAt:new Date().toISOString(),source:'saved-grid'});

function nextDrawDate(days){
  // Renvoie le prochain jour de tirage strictement après aujourd’hui,
  // afin d’éviter d’afficher un tirage déjà passé dans la journée.
  const d=new Date();
  d.setHours(12,0,0,0);
  for(let i=1;i<=7;i++){
    const candidate=new Date(d);
    candidate.setDate(d.getDate()+i);
    if(days.includes(candidate.getDay())) return candidate;
  }
  return new Date(d.getTime()+7*86400000);
}

function drawDateLabel(date){
