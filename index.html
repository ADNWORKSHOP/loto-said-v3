<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061226"><meta name="description" content="Analyses, statistiques et générateur de grilles pour le Loto et l'EuroMillions."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Votre Chance"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Loto Votre Chance — Édition Premium</title><style>
:root{--bg:#061226;--card:#0B1C38;--card2:#081732;--gold:#E8BD59;--gold2:#F7D989;--text:#FFFFFF;--muted:#B8C4D8;--line:rgba(232,189,89,.22);--line-strong:rgba(232,189,89,.45);--g:var(--gold);--field:rgba(6,18,38,.6)}
*{box-sizing:border-box}

body{margin:0;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg) radial-gradient(120% 420px at 50% -140px,rgba(232,189,89,.13),transparent 72%) no-repeat;min-height:100vh;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{width:100%;max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
.head{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:4px}
.crest{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:23px;line-height:1;background:radial-gradient(circle at 50% 30%,#18375f,#0a1a34 75%);border:1px solid var(--line-strong);box-shadow:0 0 0 4px rgba(232,189,89,.06),0 6px 18px rgba(0,0,0,.35)}

.brand i{font-style:normal;color:var(--gold)}

.pill{flex:none;min-height:40px;max-width:38%;padding:0 14px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line-strong);background:rgba(11,28,56,.85);color:var(--gold2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{display:block}
main>*{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.04);position:relative;overflow:hidden}
.card h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.2}
h2{font-size:15px;font-weight:700;margin:0 0 4px;line-height:1.3}
p,.note{color:var(--muted);font-size:13px;line-height:1.55;margin:8px 0 0}
.note{font-size:12px}
.kicker,.hero-kicker{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.mt{margin-top:14px}
.page-head{display:flex;align-items:center;gap:12px}
.page-head>div{min-width:0}

.games,.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.tabs{display:flex;gap:8px;overflow-x:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 16px;margin-top:10px;border-radius:14px;border:1px solid var(--line-strong);background:transparent;color:var(--gold2);font-size:14px;font-weight:700;line-height:1.2;transition:transform .15s,background .15s}

.list{display:flex;flex-wrap:wrap;gap:8px}

.rank li{display:flex;align-items:center;gap:10px}
.bar{flex:1;min-width:0;height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.rank.cool .bar i{background:linear-gradient(90deg,#7186AA,#D4DCEA)}
.rank small{flex:none;min-width:66px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.hero{padding:18px 4px 6px;text-align:center}

.hero .btn{width:auto;display:inline-flex;margin-top:16px;padding:12px 22px}

.space{display:flex;align-items:center;gap:12px}.space>div{flex:1;min-width:0}.space p{margin-top:4px}.space .btn{width:auto;margin:0;flex:none;padding:10px 16px}
.nav{position:fixed;z-index:10;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(6,18,38,.9);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}

.info-box{margin-top:14px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:rgba(6,18,38,.5);font-size:13px;color:var(--muted)}

.account-status{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--card);color:var(--gold);font-size:11px;font-weight:700}

@media(prefers-reduced-motion:reduce){main>*{animation:none}*{transition:none!important}}
.checks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}

vg><span>Mes gains</span></button><button type="button" class="" data-page="fdj" onclick="pg('fdj',this)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4v4h-4z"/></svg><span>Résultats</span></button><button type="button" class="" data-page="settings" onclick="pg('settings',this)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Réglages</span></button></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" crossorigin="anonymous"></script><script src="lib/account.js"></script><script src="data/draws.js"></script><script src="lib/stats-engine.js"></script><script src="lib/stats-advanced.js"></script><script src="lib/grid-generator.js"></script><script src="lib/backtest.js"></script><script src="data/backtest.js"></script><script src="lib/fdj-merge.js"></script><script>
/* CONFIGURATION À RENSEIGNER AVANT D'ACTIVER LES COMPTES.
   Dans Supabase : Project Settings > API > Project URL + anon/public key.
   Ne jamais mettre une clé service_role dans ce fichier. */
const SUPABASE_URL = "https://habxtjjtpvqykxbumgwh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KjIZ8wlsMEgmcOdPYccn5A_jr0u8F4N";
let sb = null, authUser = null, cloudLoaded = false, cloudError = "", voluntarySignOut = false, authMode = "signin", pendingEmail = "";
const LAST_EMAIL_KEY = "lvc_last_email", EXPIRED_KEY = "lvc_session_expired";
function supabaseReady(){
  return !!(window.supabase && window.AccountCore && SUPABASE_URL.startsWith("https://") &&
    SUPABASE_ANON_KEY.length > 20 && !SUPABASE_URL.includes("REMPLACER_") &&
    !SUPABASE_ANON_KEY.includes("REMPLACER_"));
}
// Session conservée dans le stockage local du navigateur et renouvelée automatiquement.
// Flux « implicit » : le lien e-mail fonctionne même s’il s’ouvre dans un autre navigateur que celui de la demande.
// Lu avant la création du client : Supabase nettoie ensuite l’URL du lien e-mail.
const REDIRECT_URL = location.origin + location.pathname;
const AUTH_REDIRECT = window.AccountCore ? AccountCore.parseAuthRedirect(location.hash, location.search) : {present:false};
if(supabaseReady()) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:"implicit"}
});
function escAuth(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function lastEmail(){return localStorage.getItem(LAST_EMAIL_KEY)||"";}
function currentAccountState(){return AccountCore.accountState(authUser,{expired:localStorage.getItem(EXPIRED_KEY)==="1"});}
let authDraft = {firstName:"", lastName:"", email:""}, lastSelfUpdate = 0;
function authMessage(message,isError){
  if(!message)return "";
  const error=isError===undefined?/^Erreur|^Aucun|^Trop|^Adresse e-mail (invalide|pas|refusée)|^E-mail ou|^Mot de passe trop|^Les deux|^Lien|^Connexion internet|^Un compte|^Session|^Saisissez|^Le nouveau/.test(message):isError;
  return `<p class="auth-note ${error?"auth-error":"auth-ok"}" role="${error?"alert":"status"}">${escAuth(message)}</p>`;
}
function statusBadge(state){
  const L={signed_in:["Connecté","auth-ok"],email_unconfirmed:["Adresse e-mail à confirmer","auth-error"],expired:["Session expirée","auth-error"],signed_out:["Non connecté",""]}[state];
  return `<p class="auth-note ${L[1]}" data-account-state="${state}"><b>Statut :</b> ${L[0]}</p>`;
}
function setAuthMode(m){authMode=m;accountPage();}
function field(id){const el=document.getElementById(id);return el?el.value:"";}
function busy(btn,label){if(!btn)return;btn.disabled=true;btn.setAttribute("aria-busy","true");btn.innerHTML=`<span class="spin" aria-hidden="true"></span>${escAuth(label)}`;}
function submitBtn(e){return e.submitter||e.target.querySelector("button[type=submit]");}
async function authCall(fn){try{return await fn();}catch(err){return {data:null,error:err};}}
function authFail(msg){accountPage(msg,true);}
function sessionLost(){authUser=null;cloudLoaded=false;authMode="signin";localStorage.setItem(EXPIRED_KEY,"1");}
function emailInput(value){return `<div><label for="accountEmail">Adresse e-mail</label><input id="accountEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="254" required value="${value}" placeholder="vous@exemple.fr"></div>`;}
function pwdInput(id,label,auto){return `<div><label for="${id}">${label}</label><input id="${id}" data-pwd type="password" autocomplete="${auto}" minlength="${AccountCore.PASSWORD_MIN}" maxlength="${AccountCore.PASSWORD_MAX}" required placeholder="${AccountCore.PASSWORD_MIN} caractères min., lettres et chiffres"></div>`;}
function showPwdToggle(){return `<label class="auth-check"><input type="checkbox" onchange="this.form.querySelectorAll('input[data-pwd]').forEach(i=>i.type=this.checked?'text':'password')"><span>Afficher le mot de passe</span></label>`;}
function nameInputs(first,last){return `<div class="auth-pair"><div><label for="firstName">Prénom</label><input id="firstName" autocomplete="given-name" maxlength="80" required value="${escAuth(first)}" placeholder="Votre prénom"></div>
      <div><label for="lastName">Nom</label><input id="lastName" autocomplete="family-name" maxlength="80" required value="${escAuth(last)}" placeholder="Votre nom"></div></div>`;}
function newPasswordView(){
  return `<h2 class="auth-h">Nouveau mot de passe</h2>
    <p>Ce mot de passe servira à vous connecter sur tous vos appareils, y compris l’application installée sur l’écran d’accueil.</p>
    <form class="auth-form" onsubmit="saveNewPassword(event)">
      ${pwdInput("newPassword","Nouveau mot de passe","new-password")}
      ${pwdInput("newPassword2","Confirmez le mot de passe","new-password")}
      ${showPwdToggle()}
      <button class="btn main" type="submit">Enregistrer le mot de passe</button>
    </form>
    <button class="btn" type="button" onclick="setAuthMode('signin')">Annuler</button>`;
}
function signedInView(){
  const state=currentAccountState();
  if(authMode==="newpass")return statusBadge(state)+newPasswordView();
  const p=AccountCore.profileFromUser(authUser);
  const name=[p.firstName,p.lastName].filter(Boolean).join(" ");
  const initials=((p.firstName[0]||"")+(p.lastName[0]||"")||p.email[0]||"?").toUpperCase();
  return `${statusBadge(state)}
    <div class="auth-id"><span class="auth-avatar" aria-hidden="true">${escAuth(initials)}</span><div><b>${escAuth(name||"Mon compte")}</b><small>${escAuth(p.email)} • ${p.emailConfirmed?"adresse confirmée":"confirmation en attente"}</small></div></div>
    ${authUser.new_email?`<p class="auth-note">Changement d’adresse en attente : confirmez-le avec le lien envoyé à <b>${escAuth(authUser.new_email)}</b>.</p>`:""}
    <h2 class="auth-h">Mes coordonnées</h2>
    <form class="auth-form" onsubmit="saveProfile(event)">
      ${nameInputs(p.firstName,p.lastName)}
      <div><label for="profileEmail">Adresse e-mail</label><input id="profileEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="254" required value="${escAuth(p.email)}"></div>
      <button class="btn main" type="submit">Enregistrer mes coordonnées</button>
    </form>
    <h2 class="auth-h">Mes données</h2>
    <p>${cloudLoaded?"Vos grilles, grilles jouées et cagnottes sont enregistrées dans votre compte.":"Données du compte non chargées"+(cloudError?" ("+escAuth(cloudError)+")":"")+" : vos données locales sont conservées et aucune sauvegarde cloud ne sera écrasée."}</p>
    <button class="btn" type="button" onclick="syncCloudNow(this)">Synchroniser maintenant</button>
    <button class="btn" type="button" onclick="setAuthMode('newpass')">Modifier mon mot de passe</button>
    <button class="btn" type="button" onclick="signOutAccount(this)">Se déconnecter</button>`;
}
function signedOutView(state){
  const email=escAuth(authDraft.email||pendingEmail||lastEmail());
  if(authMode==="pending")return `${statusBadge("email_unconfirmed")}
    <h2 class="auth-h">Confirmez votre adresse e-mail</h2>
    <p>Un e-mail a été envoyé à <b>${escAuth(pendingEmail)}</b>. Il contient un <b>lien de confirmation</b> (aucun code à saisir).</p>
    <ol class="auth-steps">
      <li>Ouvrez l’e-mail et appuyez sur le lien de confirmation.</li>
      <li>Revenez dans Loto Votre Chance.</li>
      <li>Connectez-vous une fois avec votre e-mail et votre mot de passe : vous restez ensuite connecté sur cet appareil.</li>
    </ol>
    <button class="btn main" type="button" onclick="setAuthMode('signin')">J’ai confirmé, me connecter</button>
    <button class="btn" type="button" onclick="resendConfirmation(this)">Renvoyer l’e-mail de confirmation</button>
    <p class="note">Rien reçu après quelques minutes ? Vérifiez les courriers indésirables.</p>`;
  if(authMode==="forgot")return `${statusBadge(state)}
    <h2 class="auth-h">Mot de passe oublié</h2>
    <p>Vous recevrez un lien pour choisir un nouveau mot de passe. Votre compte et vos grilles sont conservés.</p>
    <form class="auth-form" onsubmit="sendReset(event)">
      ${emailInput(email)}
      <button class="btn main" type="submit">Recevoir le lien</button>
    </form>
    <button class="btn" type="button" onclick="setAuthMode('signin')">Retour à la connexion</button>`;
  const signup=authMode==="signup";
  return `${statusBadge(state)}
    ${state==="expired"?`<p>Votre session a expiré sur cet appareil. Votre compte et vos données sont conservés : reconnectez-vous, sans ressaisir vos informations.</p>`:""}
    <div class="seg two" role="group" aria-label="Type d’accès">
      <button class="tab ${signup?"":"on"}" type="button" aria-pressed="${!signup}" onclick="setAuthMode('signin')">Se connecter</button>
      <button class="tab ${signup?"on":""}" type="button" aria-pressed="${signup}" onclick="setAuthMode('signup')">Créer un compte</button>
    </div>
    <form class="auth-form" onsubmit="${signup?"signUpAccount":"signInAccount"}(event)">
      ${signup?nameInputs(authDraft.firstName,authDraft.lastName):""}
      ${emailInput(email)}
      ${pwdInput("accountPassword","Mot de passe",signup?"new-password":"current-password")}
      ${signup?pwdInput("accountPassword2","Confirmez le mot de passe","new-password"):""}
      ${showPwdToggle()}
      <button class="btn main" type="submit">${signup?"Créer mon compte":"Se connecter"}</button>
    </form>
    ${signup?`<p class="note">Un lien de confirmation vous sera envoyé par e-mail. Le mot de passe est chiffré par Supabase : il n’est jamais enregistré dans l’application.</p>`
      :`<button class="btn" type="button" onclick="setAuthMode('forgot')">Mot de passe oublié ?</button>
    <p class="note">Compte créé avec un lien de connexion, sans mot de passe ? Choisissez « Mot de passe oublié » avec la même adresse : vous retrouverez ce compte et vos grilles.</p>`}`;
}
function accountPage(message="",isError){
  const ready=supabaseReady(), state=currentAccountState(), signed=!!authUser;
  main.innerHTML=`<section class="card">${head('user','Espace personnel','Mon compte')}<p>Votre compte conserve vos coordonnées, vos grilles et vos gains, même après fermeture de l’application.</p></section>
  <section class="card">
    ${authMessage(message,isError)}
    ${!ready?`<p class="auth-note auth-error">Le service de comptes n’a pas pu être chargé. Vérifiez la connexion internet puis rechargez la page.</p>`:signed?signedInView():signedOutView(state)}
  </section>
  <section class="card"><p class="note"><b>Sur iPhone :</b> les liens reçus par e-mail s’ouvrent dans Safari, qui a un stockage séparé de l’application ajoutée à l’écran d’accueil. Après confirmation, connectez-vous une fois avec votre mot de passe dans l’application installée : la session y reste ensuite active.</p></section>`;
  pill.textContent=signed?"MON COMPTE":state==="expired"?"RECONNEXION":"COMPTE";
}
async function signInAccount(e){
  e.preventDefault();
  if(!sb)return authFail("Erreur : l’authentification n’est pas disponible.");
  const email=AccountCore.normalizeEmail(field("accountEmail")), password=field("accountPassword");
  authDraft.email=email;
  if(!AccountCore.isValidEmail(email))return authFail("Adresse e-mail invalide.");
  if(!password)return authFail("Saisissez votre mot de passe.");
  busy(submitBtn(e),"Connexion…");
  const {error}=await authCall(()=>sb.auth.signInWithPassword({email,password}));
  if(error){
    if(AccountCore.authErrorKind(error)==="email_not_confirmed"){pendingEmail=email;authMode="pending";}
    return authFail(AccountCore.authErrorMessage(error));
  }
  localStorage.setItem(LAST_EMAIL_KEY,email);
  // La suite (chargement des données, affichage) est gérée par onAuthStateChange (SIGNED_IN).
}
async function signUpAccount(e){
  e.preventDefault();
  if(!sb)return authFail("Erreur : l’authentification n’est pas disponible.");
  const firstName=AccountCore.cleanName(field("firstName")), lastName=AccountCore.cleanName(field("lastName"));
  const email=AccountCore.normalizeEmail(field("accountEmail")), password=field("accountPassword");
  authDraft={firstName,lastName,email};
  if(!firstName||!lastName)return authFail("Erreur : prénom et nom obligatoires.");
  if(!AccountCore.isValidEmail(email))return authFail("Adresse e-mail invalide.");
  const problem=AccountCore.passwordProblem(password,field("accountPassword2"));
  if(problem)return authFail(problem);
  busy(submitBtn(e),"Création du compte…");
  const {data,error}=await authCall(()=>sb.auth.signUp({email,password,options:{emailRedirectTo:REDIRECT_URL,data:{first_name:firstName,last_name:lastName}}}));
  if(error)return authFail(AccountCore.authErrorMessage(error));
  localStorage.setItem(LAST_EMAIL_KEY,email);
  if(AccountCore.isExistingAccountSignup(data)){authMode="signin";return authFail(AccountCore.authErrorMessage({code:"user_already_exists"}));}
  if(data?.session)return;
  pendingEmail=email;authMode="pending";
  accountPage("Compte créé. Confirmez votre adresse e-mail pour l’activer.",false);
}
async function resendConfirmation(btn){
  const email=pendingEmail||authDraft.email||lastEmail();
  if(!sb||!AccountCore.isValidEmail(email)){authMode="signin";return authFail("Saisissez votre adresse e-mail et connectez-vous.");}
  busy(btn,"Envoi…");
  const {error}=await authCall(()=>sb.auth.resend({type:"signup",email,options:{emailRedirectTo:REDIRECT_URL}}));
  if(error)return authFail(AccountCore.authErrorMessage(error));
  accountPage("Nouvel e-mail de confirmation envoyé à "+email+".",false);
}
async function sendReset(e){
  e.preventDefault();
  if(!sb)return authFail("Erreur : l’authentification n’est pas disponible.");
  const email=AccountCore.normalizeEmail(field("accountEmail"));
  authDraft.email=email;
  if(!AccountCore.isValidEmail(email))return authFail("Adresse e-mail invalide.");
  busy(submitBtn(e),"Envoi…");
  const {error}=await authCall(()=>sb.auth.resetPasswordForEmail(email,{redirectTo:REDIRECT_URL}));
  if(error)return authFail(AccountCore.authErrorMessage(error));
  localStorage.setItem(LAST_EMAIL_KEY,email);
  authMode="signin";
  accountPage("Si un compte existe pour "+email+", un lien vient d’être envoyé. Ouvrez-le pour choisir votre nouveau mot de passe.",false);
}
async function saveNewPassword(e){
  e.preventDefault();
  const password=field("newPassword");
  const problem=AccountCore.passwordProblem(password,field("newPassword2"));
  if(problem)return authFail(problem);
  if(!sb||!authUser){authMode="forgot";return authFail("Session expirée : demandez un nouveau lien de réinitialisation.");}
  busy(submitBtn(e),"Enregistrement…");
  lastSelfUpdate=Date.now();
  const {error}=await authCall(()=>sb.auth.updateUser({password}));
  if(error){if(AccountCore.authErrorKind(error)==="session")sessionLost();return authFail(AccountCore.authErrorMessage(error));}
  authMode="signin";
  accountPage("Mot de passe enregistré. Utilisez-le pour vous connecter sur vos autres appareils.",false);
}
async function saveProfile(e){
  e.preventDefault();
  if(!sb||!authUser)return authFail("Session expirée. Reconnectez-vous pour continuer : vos données sont conservées.");
  const first_name=AccountCore.cleanName(field("firstName")), last_name=AccountCore.cleanName(field("lastName"));
  const email=AccountCore.normalizeEmail(field("profileEmail"));
  if(!first_name||!last_name)return authFail("Erreur : prénom et nom obligatoires.");
  if(!AccountCore.isValidEmail(email))return authFail("Adresse e-mail invalide.");
  const emailChanged=email!==AccountCore.normalizeEmail(authUser.email);
  const changes={data:{first_name,last_name}};
  if(emailChanged)changes.email=email;
  busy(submitBtn(e),"Enregistrement…");
  lastSelfUpdate=Date.now();
  const {data,error}=await authCall(()=>sb.auth.updateUser(changes,{emailRedirectTo:REDIRECT_URL}));
  if(error){if(AccountCore.authErrorKind(error)==="session")sessionLost();return authFail(AccountCore.authErrorMessage(error));}
  if(data?.user)authUser=data.user;
  accountPage(emailChanged?"Coordonnées enregistrées. Un lien de confirmation a été envoyé à "+email+" : la nouvelle adresse sera active après confirmation.":"Coordonnées enregistrées dans votre compte.",false);
}
function applyLocalState(s){
  saved=s.saved;
  localStorage.setItem("ls_saved",JSON.stringify(s.saved));
  localStorage.setItem("ls_played",JSON.stringify(s.played));
  localStorage.setItem("ls_pots",JSON.stringify(s.pots));
}
async function loadCloudState(){
  cloudLoaded=false;cloudError="";
  if(!sb||!authUser)return false;
  const {data,error}=await sb.from("user_app_data").select("data").eq("user_id",authUser.id).maybeSingle();
  if(error){cloudError=error.message;console.error("Chargement cloud:",error);return false;}
  const r=AccountCore.mergeCloudState(data?data.data:null,{saved,played:getPlayed(),pots:getPots()},localStorage.getItem("lvc_cloud_user"),authUser.id);
  applyLocalState(r.state);
  localStorage.setItem("lvc_cloud_user",authUser.id);
  cloudLoaded=true;
  if(r.needsPush)await persistCloudState();
  return true;
}
async function writeCloud(){
  const payload={saved,played:getPlayed(),pots:getPots(),updated_at:new Date().toISOString()};
  return sb.from("user_app_data").upsert({user_id:authUser.id,data:payload},{onConflict:"user_id"});
}
async function syncCloudNow(btn){
  if(!sb||!authUser){accountPage("Erreur : connectez-vous d’abord.");return;}
  busy(btn,"Synchronisation…");
  if(!cloudLoaded&&!(await authCall(loadCloudState))){accountPage("Erreur : impossible de charger le compte, réessayez dans un instant.");return;}
  const {error}=await authCall(writeCloud);
  if(error&&AccountCore.authErrorKind(error)==="session")sessionLost();
  accountPage(error?("Erreur de synchronisation : "+AccountCore.authErrorMessage(error)):"Synchronisation terminée.");
}
async function persistCloudState(){
  if(!sb||!AccountCore.canPersist({signedIn:!!authUser,cloudLoaded}))return;
  const {error}=await writeCloud();
  if(error)console.error("Sauvegarde cloud échouée:",error);
}
async function signOutAccount(btn){
  busy(btn,"Déconnexion…");
  voluntarySignOut=true;
  // scope local : ne déconnecte que cet appareil, les autres appareils restent connectés.
  if(sb)await authCall(()=>sb.auth.signOut({scope:"local"}));
  authMode="signin";
  authUser=null;cloudLoaded=false;saved=[];
  localStorage.setItem("ls_saved","[]");localStorage.setItem("ls_played","[]");localStorage.setItem("ls_pots","[]");
  localStorage.removeItem("lvc_cloud_user");localStorage.removeItem(EXPIRED_KEY);
  voluntarySignOut=false;
  accountPage("Vous êtes déconnecté de cet appareil. Vos données restent dans votre compte.");
}
function markSignedIn(user){
  authUser=user;
  localStorage.removeItem(EXPIRED_KEY);
  if(user.email)localStorage.setItem(LAST_EMAIL_KEY,AccountCore.normalizeEmail(user.email));
}
async function initAccount(){
  if(!sb)return;
  const {data,error}=await authCall(()=>sb.auth.getSession());
  if(error)console.error("Lecture de la session:",error);
  if(AUTH_REDIRECT.present)history.replaceState(null,"",REDIRECT_URL);
  const user=data?.session?.user||null;
  if(user){
    markSignedIn(user);
    await loadCloudState();
    if(AUTH_REDIRECT.type==="recovery"){authMode="newpass";accountPage("Lien validé : choisissez votre nouveau mot de passe.",false);}
    else if(AUTH_REDIRECT.type==="signup")accountPage("Adresse e-mail confirmée : votre compte est actif et vous êtes connecté.",false);
    else if(AUTH_REDIRECT.type==="email_change")accountPage("Nouvelle adresse e-mail confirmée.",false);
    else if(AUTH_REDIRECT.present)accountPage("Connexion réussie.",false);
  }
  else if(AUTH_REDIRECT.error){authMode="signin";accountPage(AccountCore.redirectErrorMessage(AUTH_REDIRECT),true);}
  else if(AUTH_REDIRECT.present){authMode="signin";accountPage("Lien traité. Connectez-vous avec votre e-mail et votre mot de passe.",false);}

C={loto:{n:'LOTO',max:49,bmax:10,bl:'Chance'},euro:{n:'EUROMILLIONS',max:50,bmax:12,bl:'Étoiles'}};let game=localStorage.ls_game||'loto',win=100,strat='opt',cur=null,saved=JSON.parse(localStorage.ls_saved||'[]');const rows=()=>DATA[game];const cfg=()=>C[game];function fmt(x){return new Date(x+'T12:00:00').toLocaleDateString('fr-FR')}function cnt(a,b=false){let f=Array((b?cfg().bmax:cfg().max)+1).fill(0);a.forEach(r=>(b?r.bonus:r.nums).forEach(n=>f[n]++));return f}function gap(a,b=false){let m=b?cfg().bmax:cfg().max,g=Array(m+1).fill(a.length+1);for(let i=a.length-1;i>=0;i--)(b?a[i].bonus:a[i].nums).forEach(n=>{if(g[n]===a.length+1)g[n]=a.length-1-i});return g}function lateOrder(kind){const lg=StatsEngine.gaps(rows(),game,kind),k=v=>v==null?Infinity:v;return (x,y)=>(k(lg[y])-k(lg[x]))||x-y}function pick(s,a){let f=cnt(a),g=gap(a),arr=Array.from({length:cfg().max},(_,i)=>i+1);if(s==='rnd')return arr.sort(()=>Math.random()-.5).slice(0,5).sort((x,y)=>x-y);if(s==='hot')arr.sort((x,y)=>f[y]-f[x]);else if(s==='cold')arr.sort((x,y)=>f[x]-f[y]);else if(s==='late')arr.sort(lateOrder('main'));else arr.sort((x,y)=>(f[y]*.7+g[y]*.2)-(f[x]*.7+g[x]*.2));let pool=arr.slice(0,Math.min(15,arr.length)),out=[];while(out.length<5&&pool.length){let i=Math.floor(Math.random()*pool.length);out.push(pool.splice(i,1)[0])}return out.sort((x,y)=>x-y)}function bonus(s,a){let f=cnt(a,1),g=gap(a,1),arr=Array.from({length:cfg().bmax},(_,i)=>i+1);if(s==='hot')arr.sort((x,y)=>f[y]-f[x]);else if(s==='cold')arr.sort((x,y)=>f[x]-f[y]);else if(s==='late')arr.sort(lateOrder('bonus'));else if(s==='rnd')return arr.sort(()=>Math.random()-.5).slice(0,game==='loto'?1:2).sort((x,y)=>x-y);else arr.sort((x,y)=>f[y]-f[x]);let k=game==='loto'?1:2,pool=arr.slice(0,Math.min(5,arr.length)),out=[];while(out.length<k&&pool.length){let i=Math.floor(Math.random()*pool.length);out.push(pool.splice(i,1)[0])}return out.sort((x,y)=>x-y)}function score(n,a){let f=cnt(a),ev=n.filter(x=>x%2===0).length,d=new Set(n.map(x=>Math.f t.display[i])+'</small>').concat(['Part des petits<small>'+pct(S.lowHigh.ballShare.display[0])+' des numéros</small>']),'scale','Petits '+S.lowHigh.lowRange+', grands '+S.lowHigh.highRange+' · sur '+S.lowHigh.total+' tirages')+box('Dizaines',S.decades.bins.map(b=>b.label+'<small>'+b.count+' • '+pct(b.percent)+'</small>'),'stats','Sur '+S.decades.totalBalls+' numéros tirés ('+W.analyzed+' tirages × 5)')+box('Sommes',['moy. '+dec1(S.sums.mean),'médiane '+dec1(S.sums.median),'min '+S.sums.min,'max '+S.sums.max],'sigma','Somme des 5 numéros principaux · '+S.sums.count+' tirages')+box('Distribution des sommes',S.sums.buckets.map(b=>b.label+'<small>'+b.count+' • '+pct(b.percent)+'</small>'),'sigma','Nombre de tirages par tranche de somme')+advStats()+'<p class="note" style="text-align:center">Historique = description du passé, pas prédiction.</p>'}function fr(x,d=2){return x.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})}function advStats(){const A=StatsAdvanced.analyze(rows(),game,{window:win}),U=A.uniformity,P=A.pairs,R=A.repeats,C=A.consecutive,Sp=A.spread;let h='';if(U)h+=box('Écart à la théorie',[ 'khi² '+fr(U.chi2,1)+'<small>'+U.df+' ddl</small>','p '+fr(U.pValue,3)+'<small>'+(U.uniformRejected?'écart notable':'compatible hasard')+'</small>',U.beyond2+' numéros<small>|z| > 1,96 (≈ '+fr(U.expectedBeyond2,1)+' attendus)</small>'].concat(U.extremes.slice(0,4).map(r=>r.n+'<small>z '+(r.z>0?'+':'')+fr(r.z,1)+'</small>')),'sigma','Sur '+U.draws.toLocaleString('fr-FR')+' tirages : chaque numéro est attendu '+fr(U.expected,1)+' fois');if(P)h+=box('Paires les plus fréquentes',P.top.map(r=>r.a+'–'+r.b+'<small>'+r.count+' fois</small>'),'stats','Attendu ≈ '+fr(P.expected,1)+' par paire. Avec '+P.totalPairs.toLocaleString('fr-FR')+' paires possibles, les plus fréquentes dépassent toujours l’attendu par simple effet du nombre.');if(Sp)h+=box('Amplitude (max − min)',['moy. '+dec1(Sp.mean),'médiane '+dec1(Sp.median),'80 % entre<small>'+Math.round(Sp.p10)+' et '+Math.round(Sp.p90)+'</small>'],'scale','Écart entre le plus grand et le plus petit numéro · '+Sp.count+' tirages');if(R)h+=box('Répétitions d’un tirage au suivant',R.rows.slice(0,4).map(r=>r.repeated+' répété'+(r.repeated>1?'s':'')+'<small>'+pct(r.percent)+' · théorie '+pct(r.expectedPercent)+'</small>'),'history','Moyenne '+fr(R.mean)+' numéro(s) repris · théorie '+fr(R.expectedMean));if(C)h+=box('Numéros consécutifs',['observé<small>'+pct(C.percent)+'</small>','théorie<small>'+pct(C.expectedPercent)+'</small>'],'stats','Part des tirages contenant au moins deux numéros qui se suivent');return h}function box(t,a,i='stats',l='',cls=''){return `<section class="card"><div class="sec-head">${ic(i)}<div><h2>${t}</h2>${l?`<span>${l}</span>`:''}</div></div><div class="list ${cls}">${a.map(x=>`<span class="chip">${x}</span>`).join('')}</div></section>`}function btTable(b){return '<table class="bt-table"><tr><th>Méthode</th><th>Moy.</th><th>≥ 2</th><th>p ajusté</th></tr>'+b.rows.map(r=>'<tr class="'+(r.vsRandom?'':'ref')+'"><td>'+r.label+'</td><td>'+fr(r.mean,3)+'</td><td>'+pct(r.atLeast2)+'</td><td>'+(r.vsRandom?fr(r.vsRandom.pAdjusted,2):'référence')+'</td></tr>').join('')+'</table>'}function btRender(r,live){const c=cfg();btr.innerHTML='<section class="card"><h2>Résultat · '+c.n+'</h2><p class="note">'+(live?'Calculé à l’instant dans votre navigateur':'Précalculé le '+new Date(r.generatedAt).toLocaleDateString('fr-FR'))+' · '+r.testedDraws.toLocaleString('fr-FR')+' tirages testés · '+r.gridsPerDraw+' grilles par méthode et par tirage · fenêtre '+r.window+' tirages.</p><div class="verdict">'+r.verdict+'</div><div class="stats mt"><div class="stat"><b>'+fr(r.theoreticalMean,3)+'</b><span>moyenne théorique</span></div><div class="stat"><b>'+pct(r.theoreticalDistribution.slice(2).reduce((a,x)=>a+x.percent,0))+'</b><span>≥ 2 théorique</span></div></div><h3 class="mt">Développement</h3><p class="note">'+fmt(r.development.from)+' → '+fmt(r.development.to)+'</p>'+btTable(r.development)+'<h3 class="mt">Validation (tirages récents)</h3><p class="note">'+fmt(r.validation.from)+' → '+fmt(r.validation.to)+'</p>'+btTable(r.validation)+'<p class="note">Moy. = bons numéros principaux par grille. p ajusté = comparaison appariée avec le hasard, corrigée de Bonferroni pour '+(r.validation.rows.length-1)+' méthodes ; en dessous de 0,05 l’écart serait significatif. Un écart doit apparaître sur les deux périodes pour être retenu.</p></section>'}function bt(){const pre=window.LVC_BACKTEST&&LVC_BACKTEST[game];main.innerHTML=`<section class="card">${head('flask','Backtest',cfg().n)}<p>Chaque méthode est rejouée tirage par tirage sur l’historique : les grilles sont générées uniquement avec les tirages antérieurs, puis comparées au tirage réel et au hasard pur.</p><details class="info-box"><summary>Comment lire ce backtest ?</summary><p><b>Sans données futures :</b> pour tester le tirage du jour J, seuls les tirages avant J sont utilisés.</p><p><b>Développement / validation :</b> les 70 % de tirages les plus anciens servent à observer, les 30 % les plus récents à vérifier. Un résultat qui n’apparaît que sur une période est du bruit.</p><p><b>Moyenne théorique :</b> nombre de bons numéros attendu pour n’importe quelle grille. Toutes les méthodes devraient s’en approcher si les tirages sont équitables.</p><p>Pour le Loto, le tableau porte sur les cinq numéros principaux. Un backtest ne garantit aucun résultat futur.</p></details><button class="btn main mt" id="btrun" onclick="runbt()">${ic('refresh')}Recalculer sur l’historique actuel</button></section><div id="btr" aria-live="polite"></div>`;if(pre)btRender(pre,false)}function runbt(){const b=document.getElementById('btrun');b.disabled=true;b.textContent='Calcul en cours…';setTimeout(()=>{try{btRender(Backtest.run(rows(),game,{window:100,gridsPerDraw:3,seed:20261013}),true)}finally{b.disabled=false;b.textContent='Recalculer sur l’historique actuel'}},30)}function savedpg(){

function nextDrawDate(days){
  // Renvoie le prochain jour de tirage strictement après aujourd’hui,
  // afin d’éviter d’afficher un tirage déjà passé dans la journée.
  const d=new Date();
  d.setHours(12,0,0,0);
  for(let i=1;i<=7;i++){
    const candidate=new Date(d);
    candidate.setDate(d.getDate()+i);
    if(days.includes(candidate.getDay())) return candidate;
  }
  return new Date(d.getTime()+7*86400000);
}

function savePlayed(a){localStorage.setItem('ls_played',JSON.stringify(a));persistCloudState()}
function playedpg(){
 const list=getPlayed();
 const fmtD=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR'):'Date inconnue';
 const calc=x=>{const draw=(DATA[x.game]||[]).find(r=>r.date===x.date);if(!draw)return {state:'missing',label:'Résultat absent de la base locale',main:0,bonus:0};return {state:'found',label:'Tirage trouvé dans la base locale',main:x.nums.filter(n=>draw.nums.includes(n)).length,bonus:x.bonus.filter(n=>draw.bonus.includes(n)).length,draw}};
 const checks=list.map(x=>({x,r:calc(x)}));
 const matched=checks.filter(z=>z.r.state==='found');
 main.innerHTML=`<section class="card">${head('ticket','Suivi des grilles jouées','Mes grilles &amp; mes gains')}<p>Enregistre uniquement les grilles réellement validées. L’application les compare aux résultats présents dans sa base locale.</p></section>
 <section class="card"><h2>Mes gains vérifiés</h2><div class="pot-summary"><div class="pot-total"><span>Gain officiel confirmé</span><strong>${moneyEUR(0)}</strong></div><div class="pot-total"><span>Grilles enregistrées</span><strong>${list.length}</strong></div></div><p class="note">Le total des gains reste à 0 € tant que le rang et le montant du gain n’ont pas été vérifiés avec le barème officiel du tirage. Les correspondances de numéros seules ne prouvent pas un gain monétaire.</p></section>
 <section class="card"><h2>Ajouter une grille jouée</h2><form class="pot-form" onsubmit="addPlayed(event)">
 <div><label for="playedGame">Jeu</label><select id="playedGame"><option value="loto">Loto</option><option value="euro">EuroMillions</option></select></div>
 <div><label for="playedDate">Date du tirage</label><input id="playedDate" type="date" required></div>
 <div class="wide"><label for="playedNums">5 numéros principaux (séparés par des virgules)</label><input id="playedNums" type="text" inputmode="numeric" placeholder="Ex. 4, 12, 23, 35, 48" required></div>
 <div class="wide"><label for="playedBonus" id="playedBonusLabel">Numéro Chance (1 numéro)</label><input id="playedBonus" type="text" inputmode="numeric" placeholder="Ex. 7" required></div>
 <div class="wide"><button class="btn main" type="submit">${ic('plus')}Enregistrer la grille jouée</button></div></form><p class="note">La date doit correspondre au tirage auquel ta grille a participé. La base de résultats intégrée peut être incomplète ou ne pas être à jour.</p></section>
 <section class="card"><h2>Historique de mes grilles</h2><div class="pot-history">${checks.length?checks.slice().reverse().map(({x,r})=>`<div class="pot-entry"><div><b>${x.game==='loto'?'Loto':'EuroMillions'} • ${fmtD(x.date)}</b><small>Numéros : ${x.nums.join(', ')} • ${x.game==='loto'?'Chance':'Étoiles'} : ${x.bonus.join(', ')}</small><small>${r.label}${r.state==='found'?` • ${r.main} numéro(s) principal(aux) et ${r.bonus} complémentaire(s) retrouvé(s)`:''}</small><small><b>Gain : non confirmé</b></small></div><div style="text-align:right"><button type="button" onclick="deletePlayed('${x.id}')">Supprimer</button></div></div>`).join(''):'<p>Aucune grille jouée enregistrée pour le moment.</p>'}</div>${list.length?'<button class="btn" onclick="clearPlayed()">Effacer toutes mes grilles</button>':''}</section>`;
 document.getElementById('playedGame').addEventListener('change',()=>{document.getElementById('playedBonusLabel').textContent=document.getElementById('playedGame').value==='loto'?'Numéro Chance (1 numéro)':'Étoiles (2 numéros séparés par une virgule)';document.getElementById('playedBonus').placeholder=document.getElementById('playedGame').value==='loto'?'Ex. 7':'Ex. 3, 11';});
}
function parseNums(s){return s.split(/[ ,;]+/).filter(Boolean).map(Number)}
function addPlayed(e){
 e.preventDefault();const g=document.getElementById('playedGame').value,date=document.getElementById('playedDate').value,nums=parseNums(document.getElementById('playedNums').value),bonus=parseNums(document.getElementById('playedBonus').value),cfgx=C[g];
 if(nums.length!==5||nums.some(n=>!Number.isInteger(n)||n<1||n>cfgx.max)||new Set(nums).size!==5){alert('Saisis exactement 5 numéros principaux valides et sans doublon.');return}
 const expected=g==='loto'?1:2;if(bonus.length!==expected||bonus.some(n=>!Number.isInteger(n)||n<1||n>cfgx.bmax)||new Set(bonus).size!==bonus.length){alert(g==='loto'?'Saisis exactement 1 numéro Chance valide.':'Saisis exactement 2 étoiles valides et différentes.');return}
 const list=getPlayed();list.push({id:String(Date.now())+Math.random().toString(16).slice(2),game:g,date,nums:[...nums].sort((a,b)=>a-b),bonus:[...bonus].sort((a,b)=>a-b),createdAt:new Date().toISOString()});savePlayed(list);playedpg();
}
function deletePlayed(id){savePlayed(getPlayed().filter(x=>x.id!==id));playedpg()}
function clearPlayed(){if(confirm('Effacer toutes les grilles jouées enregistrées ?')){savePlayed([]);playedpg()}}

function pg(p,b){const tab={grid:'saved',bt:'settings'}[p]||p;document.querySelectorAll('.nav button').forEach(x=>{const on=x.dataset.page===tab;x.classList.toggle('on',on);if(on)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});window.scrollTo(0,0);({home,grid,stats,bt,saved:savedpg,fdj,settings,pots,played:playedpg}[p])();const labels={home:'⌂',grid:'GRILLE',stats:'STATS',bt:'BACKTEST',saved:'MES GRILLES',fdj:'RÉSULTATS',settings:'RÉGLAGES',pots:'CAGNOTTES',played:'MES GAINS'};pill.textContent=labels[p]||'INFO';}function setg(g){game=g;localStorage.ls_game=g;cur=null;gen('opt')}function setw(n){win=n;stats()}function save(){saved.unshift({...cur});saved=saved.slice(0,100);localStorage.ls_saved=JSON.stringify(saved);persistCloudState();alert(authUser?'Grille sauvegardée sur votre compte.':'Grille sauvegardée sur cet appareil. Pour la retrouver après changement d’appareil, connectez-vous à votre compte.')}function del(i){saved.splice(i,1);localStorage.ls_saved=JSON.stringify(saved);persistCloudState();savedpg()}gen('opt');home();initAccount().catch(e=>console.error('Initialisation compte',e));</script><script src="lib/fdj-client.js"></script><script>
(function(){
  if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(e){console.error('Service worker',e)})})}
  var KEY='ls_install_hidden',box=document.getElementById('install'),txt=document.getElementById('install-text'),go=document.getElementById('install-go'),deferred=null;
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone||localStorage.getItem(KEY)==='1')return;
  var ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var share='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  function hide(){box.hidden=true;localStorage.setItem(KEY,'1')}
  document.getElementById('install-x').onclick=hide;
  if(isIOS){
    var safari=/Safari/.test(ua)&&!/CriOS|FxiOS|EdgiOS/.test(ua);
    txt.innerHTML=safari?'<b>Installer l’application</b>Touchez '+share+' Partager, puis « Sur l’écran d’accueil ».':'<b>Installer l’application</b>Ouvrez cette page dans Safari, puis Partager → « Sur l’écran d’accueil ».';
    box.hidden=false;
  }
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;txt.innerHTML='<b>Installer l’application</b>Accès direct depuis l’écran d’accueil, même hors connexion.';go.hidden=false;box.hidden=false});
  go.onclick=function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){deferred=null;box.hidden=true})};
  addEventListener('appinstalled',hide);
})();
</script></body></html>
