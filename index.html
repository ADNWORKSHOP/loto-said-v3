function nextDrawDate(days){
  // Renvoie le prochain jour de tirage strictement après aujourd’hui,
  // afin d’éviter d’afficher un tirage déjà passé dans la journée.
  const d=new Date();
  d.setHours(12,0,0,0);
  for(let i=1;i<=7;i++){
    const candidate=new Date(d);
    candidate.setDate(d.getDate()+i);
    if(days.includes(candidate.getDay())) return candidate;
  }
  return new Date(d.getTime()+7*86400000);
}

function drawDateLabel(date){
  return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'}).format(date).replace(/\\./g,'');
}
